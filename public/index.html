<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cat Manager</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
  </head>
  <body>
    <header>
      <nav>
        <h1>Cat Manager</h1>
        <ul>
          <li><a href="#">Home</a></li>
          <li><a href="#">About</a></li>
          <li><a href="#">Contact</a></li>
        </ul>
        <div class="buttons">
          <button id="pannierBtn" class="btn-primary">
            <i class="fas fa-shopping-basket"></i> Pannier
          </button>
          <button id="loginBtn" class="btn-primary">LOGIN</button>
          <button id="signupBtn" class="btn-primary">SIGNUP</button>
        </div>
      </nav>
    </header>
    <div class="container">
      <div class="header">
        <div class="search-bar">
          <input
            type="text"
            class="searchInpute"
            id="searchInput"
            placeholder="Search cats..."
          />
          <button id="searchBtn" class="btn-primary">
            <i class="fas fa-search"></i>
          </button>
        </div>
        <button id="addBtn" class="btn-primary">
          <i class="fas fa-plus"></i> Add Cat
        </button>
      </div>

      <div class="cards-container" id="cardsContainer">
        <!-- Place Cards  -->
      </div>

      <div class="pagination" id="pagination">
        <button id="prevBtn" class="btn-primary" disabled>
          <i class="fas fa-chevron-left"></i> Previous
        </button>
        <span id="pageInfo">Page 1 of 1</span>
        <button id="nextBtn" class="btn-primary" disabled>
          Next <i class="fas fa-chevron-right"></i>
        </button>
      </div>
    </div>

    <!-- Pannier Sidebar -->
    <div id="pannierSidebar" class="sidebar">
      <div class="sidebar-header">
        <h2>My Pannier</h2>
        <span class="close-sidebar">&times;</span>
      </div>
      <div class="sidebar-content" id="pannierContent">
        <!-- Selected cats will appear here -->
        <p class="empty-pannier">Your pannier is empty.</p>
      </div>
    </div>

    <!-- Modal -->
    <div id="catModal" class="modal">
      <div class="modal-content">
        <span class="close">&times;</span>
        <h2 id="modalTitle">Add New Cat</h2>
        <form id="catForm">
          <input type="hidden" id="catId" />
          <div class="form-group">
            <label for="catName">Name</label>
            <input
              type="text"
              id="catName"
              required
              placeholder="Enter cat name"
            />
          </div>
          <div class="form-group">
            <label for="catDescription">Description</label>
            <textarea
              id="catDescription"
              required
              placeholder="Enter description"
              rows="3"
            ></textarea>
          </div>
          <div class="form-group">
            <label for="catTag">Tag</label>
            <input type="text" id="catTag" required placeholder="Enter tag" />
          </div>
          <div class="form-group">
            <label for="catImage">Image URL</label>
            <input
              type="url"
              id="catImage"
              required
              placeholder="Enter image URL"
            />
          </div>
          <button type="submit" class="btn-primary">Save</button>
        </form>
      </div>
    </div>

    <!-- Login Modal -->
    <div id="loginModal" class="modal">
      <div class="modal-content">
        <span class="close login-close">&times;</span>
        <h2>Login</h2>
        <form id="loginForm">
          <div class="form-group">
            <label for="loginEmail">Email</label>
            <input
              type="email"
              id="loginEmail"
              required
              placeholder="Enter email"
            />
          </div>
          <div class="form-group">
            <label for="loginPassword">Password</label>
            <input
              type="password"
              id="loginPassword"
              required
              placeholder="Enter password"
            />
          </div>
          <button type="submit" class="btn-primary">Login</button>
        </form>
      </div>
    </div>

    <!-- Signup Modal -->
    <div id="signupModal" class="modal">
      <div class="modal-content">
        <span class="close signup-close">&times;</span>
        <h2>Sign Up</h2>
        <form id="signupForm">
          <div class="form-group">
            <label for="signupUsername">Username</label>
            <input
              type="text"
              id="signupUsername"
              required
              placeholder="Enter username"
            />
          </div>
          <div class="form-group">
            <label for="signupEmail">Email</label>
            <input
              type="email"
              id="signupEmail"
              required
              placeholder="Enter email"
            />
          </div>
          <div class="form-group">
            <label for="signupPassword">Password</label>
            <input
              type="password"
              id="signupPassword"
              required
              placeholder="Enter password"
            />
          </div>
          <button type="submit" class="btn-primary">Sign Up</button>
        </form>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
